<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>اختبار الصوت</title></head>
<body>
  <!-- كلام (0–2.7) ثم صمت ثم موسيقى (3.2–7.2) ثم كلام (7.2–12.6)، وترجمة فيها لفظ عند 10.4–11.4 -->
  <video id="v" width="320" playsinline>
    <track kind="captions" src="audio-test.vtt" srclang="ar" label="عربي">
  </video>
  <button id="play" onclick="document.getElementById('v').play()">تشغيل</button>
  <script>
    // مثل مواقع الفيديو (يوتيوب، تيك توك): المقطع من blob لا من رابط مباشر
    fetch("audio-test.webm").then((r) => r.blob()).then((b) => { document.getElementById("v").src = URL.createObjectURL(b); });
  </script>
</body>
</html>
