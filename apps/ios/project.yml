# مشروع Xcode لفلتر حصن على آيفون — يُولَّد بأداة XcodeGen (مجانية):
#   brew install xcodegen && cd apps/ios && xcodegen
# الحساب: Mawaama Company Holding (Team 2QGUC9PT86). المعرّف: com.muwamah.hisnfilter
name: HisnFilter
options:
  bundleIdPrefix: com.muwamah
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_PREFIX: com.muwamah          # ← حساب Mawaama Company Holding
    DEVELOPMENT_TEAM: 2QGUC9PT86
    APP_GROUP: group.$(BUNDLE_PREFIX).hisnfilter
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # سكربت نسخ الإضافة يقرأ من خارج مجلد المشروع
    CODE_SIGN_STYLE: Automatic

packages:
  # ONNX Runtime (MIT) لفصل الموسيقى بمعالج الجوال (مع Core ML)
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.20.0

targets:
  HisnFilter:
    type: application
    platform: iOS
    sources:
      - HisnFilter
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hisnfilter
        PRODUCT_NAME: HisnFilter
        # حلقات البكسلات بطيئة جدًا بلا تحسين حتى في نسخ التجربة
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        CODE_SIGN_ENTITLEMENTS: HisnFilter/HisnFilter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HisnFilter/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: فلتر حصن
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # الآيباد: كل الاتجاهات (الشريط الجانبي في العرض الأفقي)
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        HisnAppGroup: $(APP_GROUP)
        NSPhotoLibraryAddUsageDescription: لحفظ نسخة الفيديو النظيفة في الصور.
        # «مشاركة» ← «فلتر حصن» من واتساب وغيره يفتح الرابط في المتصفح المحمي
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [hisnfilter]
        # «أزل الموسيقى» يكمل بعد الخروج من التطبيق (المعالجة المستمرة في iOS 26)
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).clean.music]
        UIBackgroundModes: [processing]
    preBuildScripts:
      - name: نسخ صفحات حصن (تنظيف الفيديو، والمتصفح المحمي)
        script: |
          EXT="$SRCROOT/../extension"
          if [ ! -f "$EXT/dist/web/pages/clean-video.html" ]; then
            echo "error: ابنِ الصفحات أولًا: cd apps/extension && npm install && npm run build -- web"
            exit 1
          fi
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
          mkdir -p "$DEST/models/nudenet" "$DEST/models/yamnet"
          rsync -a --delete --exclude ".DS_Store" --exclude "models/nudenet" --exclude "models/yamnet" "$EXT/dist/web/" "$DEST/"
          cp "$EXT/static/models/nudenet/320n.onnx" "$DEST/models/nudenet/"
          cp "$EXT/static/models/yamnet/yamnet.onnx" "$DEST/models/yamnet/"
          # نماذج الكشف بكود الآيفون (نفس نماذج أندرويد): الوجوه والجنس والأجسام
          mkdir -p "$DEST/models/native" && cp "$SRCROOT/../android/models/"*.onnx "$DEST/models/native/"
          # قوائم الموضوعات والألعاب (نفس ملف الإضافة وأندرويد)
          cp "$SRCROOT/../../packages/core/data/topics.json" "$DEST/topics.json"
          cp "$SRCROOT/../../packages/core/data/scene.json" "$DEST/scene.json"
          # قائمة المواقع الإباحية للمتصفح المحمي
          mkdir -p "$DEST/rules" && cp "$EXT/static/rules/adult-domains.json" "$EXT/static/rules/streaming-domains.json" "$DEST/rules/"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: onnxruntime
        product: onnxruntime
      - target: HisnShare
      - target: HisnSafari
      - target: HisnShieldConfiguration
      - target: HisnShieldAction
      - target: HisnMonitor
      - target: HisnBroadcast

  # إضافة Safari: نفس كود إضافة المتصفح (apps/extension/dist/safari)
  HisnSafari:
    type: app-extension
    platform: iOS
    sources:
      - SafariExtension
      - path: Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hisnfilter.SafariExtension
        CODE_SIGN_ENTITLEMENTS: SafariExtension/SafariExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SafariExtension/Info.plist
    preBuildScripts:
      - name: نسخ ملفات الإضافة
        script: |
          SRC="$SRCROOT/../extension/dist/safari"
          if [ ! -f "$SRC/manifest.json" ]; then
            echo "error: ابنِ الإضافة أولًا: cd apps/extension && npm install && npm run build -- safari"
            exit 1
          fi
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DEST"
          rsync -a --delete-excluded --exclude ".DS_Store" "$SRC/" "$DEST/"
        basedOnDependencyAnalysis: false

  # شكل شاشة الحجب
  HisnShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfiguration
      - path: Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hisnfilter.ShieldConfiguration
        CODE_SIGN_ENTITLEMENTS: ShieldConfiguration/ShieldConfiguration.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShieldConfiguration/Info.plist

  # أزرار شاشة الحجب
  HisnShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ShieldAction
      - path: Shared/AppGroup.swift
      - path: Shared/Shields.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hisnfilter.ShieldAction
        CODE_SIGN_ENTITLEMENTS: ShieldAction/ShieldAction.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShieldAction/Info.plist

  # يعيد حجب التطبيقات بعد انتهاء السماح المؤقت (15 دقيقة)
  HisnMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      - path: Shared/AppGroup.swift
      - path: Shared/Shields.swift
      - path: Shared/Games.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hisnfilter.DeviceActivityMonitor
        CODE_SIGN_ENTITLEMENTS: Monitor/Monitor.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Monitor/Info.plist

  # فحص الشاشة (بث الشاشة على الجهاز نفسه): يكشف المخالف ويحجب التطبيقات المختارة
  HisnBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - path: Models/FaceRes.mlpackage
        type: file # حزمة نموذج يُترجمها Xcode (يولّد صنف FaceRes)، لا مجلد يُنسخ
      - path: Shared/AppGroup.swift
      - path: Shared/Shields.swift
      - path: Shared/ScreenPolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hisnfilter.Broadcast
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Broadcast/Info.plist

  # «مشاركة» ← «تنظيف بفلتر حصن» من تطبيق الصور: ينسخ الفيديو ويكمله التطبيق
  HisnShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - path: Shared/AppGroup.swift
      - path: Shared/SharedVideo.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).hisnfilter.Share
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Share/Info.plist
