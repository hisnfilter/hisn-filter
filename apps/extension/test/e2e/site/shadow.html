<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Shadow DOM</title></head>
<body>
  <hisn-card id="card"></hisn-card>
  <script>
    customElements.define("hisn-card", class extends HTMLElement {
      connectedCallback() {
        const r = this.attachShadow({ mode: "open" });
        r.innerHTML = '<p id="t">تعليق: يا منيوك</p><img id="woman" src="woman.jpg" width="200"><img id="land" src="landscape.jpg" width="200">';
      }
    });
  </script>
</body></html>
